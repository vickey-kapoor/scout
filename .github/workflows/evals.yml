# Runs the eval suite (evals.py) with real API calls.
# Needs repo secrets ANTHROPIC_API_KEY and TAVILY_API_KEY.
# Each run costs tokens, so it only runs when agent code changes, or by hand.
name: evals

on:
  pull_request:
    paths:
      - "agent.py"
      - "tools.py"
      - "models.py"
      - "memory.py"
      - "trace.py"
      - "evals.py"
      - "test_evals.py"
      - "evals/**"
      - "requirements.txt"
      - ".github/workflows/evals.yml"
  workflow_dispatch:          # "Run workflow" button on the Actions tab

# a new push to the same PR cancels the older, now-stale run (saves tokens)
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # free and instant: if the grader is broken, don't spend tokens on a run it would misjudge
      - name: Test the grader
        run: python test_evals.py
      # a missing secret arrives as an empty string: stop with one clear error
      # instead of letting every eval case fail on auth
      - name: Check API key secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          missing=0
          for name in ANTHROPIC_API_KEY TAVILY_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repo secret $name is not set (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EVAL_MIN_PASS: "0.8"
        run: python evals.py
      - name: Upload answers and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/
            traces/
          retention-days: 14
